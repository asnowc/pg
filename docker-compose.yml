services:
  postgres-auth:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin-password
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
            pg_isready -U postgres -d postgres
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 5s
