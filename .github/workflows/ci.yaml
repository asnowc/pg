  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: check:type
        run: pnpm check:type
      - name: check:fmt
        if: always()
        run: pnpm check:fmt
      - name: publish dry-run
        run: pnpm dlx jsr publish --dry-run
