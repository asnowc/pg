# Local initialization and administrative access.
local   all             all                                     trust
host    all             postgres                                trust

# Each test user intentionally exercises a different authentication method.
host    all             auth_trust                              trust
host    all             auth_password                           password
host    all             auth_scram                              scram-sha-256

# Do not silently allow users added later to bypass the authentication matrix.
host    all             all                                     reject