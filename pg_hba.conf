# Test-only rules. This configuration is intentionally unsuitable for production.
local       all         all                                     trust
hostnossl   all         postgres        0.0.0.0/0               trust
hostnossl   all         postgres        ::/0                    trust
hostssl     all         postgres        0.0.0.0/0               trust
hostssl     all         postgres        ::/0                    trust

# Each role intentionally exercises a distinct protocol path.
hostnossl   auth_test   auth_trust      0.0.0.0/0               trust
hostnossl   auth_test   auth_trust      ::/0                    trust
hostnossl   auth_test   auth_password   0.0.0.0/0               password
hostnossl   auth_test   auth_password   ::/0                    password
hostnossl   auth_test   auth_scram      0.0.0.0/0               scram-sha-256
hostnossl   auth_test   auth_scram      ::/0                    scram-sha-256
hostnossl   auth_test   auth_tls        0.0.0.0/0               reject
hostnossl   auth_test   auth_tls        ::/0                    reject
hostssl     auth_test   auth_tls        0.0.0.0/0               scram-sha-256
hostssl     auth_test   auth_tls        ::/0                    scram-sha-256

host        all         all             0.0.0.0/0               reject
host        all         all             ::/0                    reject
